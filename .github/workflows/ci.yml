name: CI

# No base-branch filter on pull_request: feature PRs target release/* branches,
# and a PR that silently runs no CI at all reads as green when it isn't.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, curl, dom, tokenizer, intl, iconv
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts
          path: |
            dist/
            vendor/
          retention-days: 1

  phpunit:
    name: PHPUnit Tests
    runs-on: depot-ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, curl, dom, tokenizer, intl, iconv

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

  phpcs:
    name: PHP Code Standards
    runs-on: depot-ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, curl, dom, tokenizer, intl, iconv

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Run PHPCS
        run: php vendor/bin/phpcs

  lint-js:
    name: JS & CSS Lint
    runs-on: depot-ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css
